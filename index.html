<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengudoku Tutorials</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #007acc;
            --border-radius: 8px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .controls {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        input[type="number"] {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: var(--border-radius);
            border: 1px solid #ccc;
            outline: none;
            width: 150px;
        }

        button {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: var(--border-radius);
            border: 1px solid #ccc;
            background-color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #eee;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background-color: #eaeaea;
        }

        .card-info {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            background-color: #fafafa;
            border-top: 1px solid #eee;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 85%;
            max-height: 80%;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1010;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            padding: 20px;
            user-select: none;
            z-index: 1010;
            transition: color 0.2s;
        }

        .nav-btn:hover {
            color: var(--primary-color);
        }

        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        .modal-caption {
            position: absolute;
            bottom: 30px;
            color: #fff;
            font-size: 22px;
            text-align: center;
            width: 100%;
        }
    </style>
    <meta name="google-site-verification" content="bnV5MGADHTbB91DRwelD-i--F7qr1GB4hAAKn5dudPQ" />
</head>
<body>

    <h1>Pengudoku Tutorials</h1>
    
    <div class="controls">
        <label for="levelSearch">Search Level: </label>
        <input type="number" id="levelSearch" placeholder="e.g. 0" min="0" max="9999" oninput="filterLevels()">
        <button onclick="clearSearch()">Show All</button>
    </div>

    <div class="grid-container" id="tutorialGrid">
    </div>

    <div id="imageModal" class="modal" onclick="handleModalClick(event)">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <span class="nav-btn prev-btn" onclick="navigateModal(-1)">&#10094;</span>
        <img class="modal-content" id="modalImg" alt="Tutorial View">
        <span class="nav-btn next-btn" onclick="navigateModal(1)">&#10095;</span>
        <div id="caption" class="modal-caption"></div>
    </div>

    <script>
        const startLevel = 0;
        const endLevel = 9999;
        const baseRepoUrl = "https://raw.githubusercontent.com/sajid1397/Pengudoku/main/tutorials/";
        
        let currentActiveLevel = null;
        const grid = document.getElementById('tutorialGrid');
        const searchInput = document.getElementById('levelSearch');

        function getFolder(level) {
            if (level <= 20) return "LEVELS00-20";
            const start = Math.floor((level - 1) / 20) * 20 + 1;
            const end = start + 19;
            return `LEVELS${start}-${end}`;
        }

        function getFileName(level) {
            const padded = level < 10 ? `0${level}` : level;
            return `LEVEL${padded}.jpg`;
        }

        function getImageUrl(level) {
            return `${baseRepoUrl}${getFolder(level)}/${getFileName(level)}`;
        }

        for (let i = startLevel; i <= endLevel; i++) {
            const displayLabel = i < 10 ? `0${i}` : i;
            const fullImageUrl = getImageUrl(i);

            let card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-level', i);
            card.onclick = () => openModal(i);

            card.innerHTML = `
                <img src="${fullImageUrl}" alt="Level ${displayLabel} Tutorial" loading="lazy">
                <div class="card-info">Level ${displayLabel}</div>
            `;
            grid.appendChild(card);
        }

        function filterLevels() {
            const searchVal = searchInput.value.trim();
            const cards = document.querySelectorAll('.card');

            cards.forEach(card => {
                const cardLevel = card.getAttribute('data-level');
                if (searchVal === '' || cardLevel === searchVal) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function clearSearch() {
            searchInput.value = '';
            filterLevels();
        }

        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const captionText = document.getElementById('caption');

        function openModal(level) {
            currentActiveLevel = level;
            const displayLabel = level < 10 ? `0${level}` : level;
            
            modal.style.display = "flex";
            modalImg.src = getImageUrl(level);
            captionText.textContent = `Level ${displayLabel} Tutorial`;
        }

        function closeModal() {
            modal.style.display = "none";
            currentActiveLevel = null;
        }

        function navigateModal(direction) {
            if (currentActiveLevel === null) return;
            
            let nextLevel = currentActiveLevel + direction;
            if (nextLevel < startLevel) nextLevel = endLevel;
            if (nextLevel > endLevel) nextLevel = startLevel;
            
            openModal(nextLevel);
        }

        function handleModalClick(e) {
            if (e.target === modal) {
                closeModal();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (modal.style.display === "flex") {
                if (e.key === 'Escape') closeModal();
                if (e.key === 'ArrowLeft') navigateModal(-1);
                if (e.key === 'ArrowRight') navigateModal(1);
            }
        });
    </script>
</body>
</html>
